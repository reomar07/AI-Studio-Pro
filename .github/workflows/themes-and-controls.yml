name: Themes and controls preview
on:
  push:
    branches: [feature/themes-and-controls]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - name: Existing Python regression checks
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax and appearance validation
        run: |
          for f in frontend/scripts/*.js; do node --check "$f"; done
          node tests/appearance_core.test.cjs
          node --check tests/themes_browser.cjs
      - name: Install browser for real DOM tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test the actual page and preview controls
        run: node tests/themes_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: themes-browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
      - name: Prepare source package without dependencies or private data
        run: git archive --format=zip --output=AI-Studio-Pro-themes-preview-2.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Pro-themes-preview-2-source
          path: AI-Studio-Pro-themes-preview-2.zip
