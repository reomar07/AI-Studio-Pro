name: Themes and controls preview
on:
  push:
    branches: [feature/themes-and-controls]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - name: Existing Python regression checks
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax and appearance validation
        run: |
          for f in frontend/scripts/*.js; do node --check "$f"; done
          node tests/appearance_core.test.cjs
      - name: Prepare source package without dependencies or private data
        run: git archive --format=zip --output=AI-Studio-Pro-themes-preview.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Pro-themes-preview-source
          path: AI-Studio-Pro-themes-preview.zip
