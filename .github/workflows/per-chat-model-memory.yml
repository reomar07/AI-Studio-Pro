name: Per-chat model memory checks
on:
  push:
    branches: [feature/per-chat-model-memory]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - name: All Python tests including bound generation
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax and existing core regressions
        run: |
          for f in frontend/scripts/*.js tests/*.cjs; do node --check "$f"; done
          node tests/model_favorites.test.cjs
          node tests/appearance_core.test.cjs
          node tests/speech_core.test.cjs
          node tests/spelling_core.test.cjs
