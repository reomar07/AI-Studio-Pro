name: Voice controls preview
on:
  push:
    branches: [feature/voice-controls]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - name: Regression and pure JavaScript checks
        run: |
          python -m unittest discover -s tests -v
          for f in frontend/scripts/*.js tests/*.cjs; do node --check "$f"; done
          node tests/appearance_core.test.cjs
          node tests/speech_core.test.cjs
      - name: Install browser tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Existing themes and clipboard regression
        run: node tests/themes_browser.cjs
      - name: Voice controls with simulated audio
        run: node tests/speech_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-preview-diagnostics
          path: test-results/
          if-no-files-found: ignore
      - name: Prepare source package
        run: git archive --format=zip --output=AI-Studio-Pro-voice-preview.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Pro-voice-preview-source
          path: AI-Studio-Pro-voice-preview.zip
