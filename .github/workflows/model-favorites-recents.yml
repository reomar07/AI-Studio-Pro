name: Model favorites and recents preview
on:
  push:
    branches: [feature/model-favorites-recents]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - name: All Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax and feature checks
        run: |
          for f in frontend/scripts/*.js tests/*.cjs; do node --check "$f"; done
          node tests/model_favorites.test.cjs
          node tests/appearance_core.test.cjs
          node tests/speech_core.test.cjs
          node tests/spelling_core.test.cjs
      - name: Install browser tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Existing browser regressions
        run: |
          node tests/themes_browser.cjs
          node tests/speech_browser.cjs
          node tests/spelling_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-shortcuts-diagnostics
          path: test-results/
          if-no-files-found: ignore
      - name: Prepare source preview
        run: git archive --format=zip --output=AI-Studio-Pro-model-shortcuts-preview.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Pro-model-shortcuts-preview-source
          path: AI-Studio-Pro-model-shortcuts-preview.zip
